[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "czzedit"
version = "0.3.2"
description = "Local CHZZK VOD and LIVE chat capture and editing-candidate detection"
requires-python = ">=3.10"
dependencies = ["websocket-client==1.9.0"]

[project.optional-dependencies]
login = ["playwright>=1.50,<2"]

[project.scripts]
czzedit = "czzedit.__main__:main"

[tool.setuptools]
packages = ["czzedit"]

[tool.setuptools.package-data]
czzedit = ["ui.html", "player.js", "v2.js", "live.js", "vendor/*"]
